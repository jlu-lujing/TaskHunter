services:
  taskhunter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskhunter
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/taskhunter:/home/taskhunter/.config/taskhunter
      - ./data/opencode/share:/home/taskhunter/.local/share/opencode
      - ./data/opencode/state:/home/taskhunter/.local/state/opencode
      - ./data/opencode/config:/home/taskhunter/.config/opencode
      - ./data/ssh:/home/taskhunter/.ssh
      - ./workspaces:/home/taskhunter/workspaces
    environment:
      # Docker binds TaskHunter to 0.0.0.0 for port mapping, so UI auth is required.
      # Set this before starting, for example:
      #   TASKHUNTER_UI_PASSWORD="$(openssl rand -base64 24)" docker compose up -d
      TASKHUNTER_UI_PASSWORD: ${TASKHUNTER_UI_PASSWORD:?Set TASKHUNTER_UI_PASSWORD before exposing TaskHunter through Docker}
    # TASKHUNTER_HOST: 0.0.0.0  # Bind address (default in Docker entrypoint: 0.0.0.0)
    # TASKHUNTER_TUNNEL_PROVIDER: cloudflare
    # TASKHUNTER_TUNNEL_MODE: quick  # quick | managed-remote | managed-local
    # TASKHUNTER_TUNNEL_HOSTNAME: app.example.com  # required for managed-remote
    # TASKHUNTER_TUNNEL_TOKEN: your_cloudflare_token  # required for managed-remote
    # TASKHUNTER_TUNNEL_CONFIG: /home/taskhunter/.cloudflared/config.yml  # optional for managed-local
    # OH_MY_OPENCODE: true # enable oh-my-opencode
    # OPENCODE_HOST: http://172.17.0.1:4096 # Connect to external OpenCode server
    # OPENCODE_SKIP_START: true # skip start opencode
    # TASKHUNTER_OPENCODE_HOSTNAME: 0.0.0.0 # Bind OpenCode to all interfaces
    restart: unless-stopped
